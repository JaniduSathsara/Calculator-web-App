<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div>
        <h2 class="txt">Calculator</h2>
        <input class="display" id="numberType" type="text">

        <div class="buttons">
            <input class="function" type="button" value="C" onclick="clikFunctions()">
            <input class="function" type="button" value="+/-">
            <input class="function" type="button" value="%">
            <input class="operator" type="button" value="÷">

            <input class="number" type="button" value="7" onclick="clickNumbers()">
            <input class="number" type="button" value="8" onclick="clickNumbers()">
            <input class="number" type="button" value="9" onclick="clickNumbers()">
            <input class="operator" type="button" value="×" onclick="clickOperators()">

            <input class="number" type="button" value="4" onclick="clickNumbers()">
            <input class="number" type="button" value="5" onclick="clickNumbers()">
            <input class="number" type="button" value="6" onclick="clickNumbers()">
            <input class="operator" type="button" value="−" onclick="clickOperators()">

            <input class="number" type="button" value="1" onclick="clickNumbers()">
            <input class="number" type="button" value="2" onclick="clickNumbers()">
            <input class="number" type="button" value="3" onclick="clickNumbers()">
            <input class="operator" type="button" value="+" onclick="clickOperators()">

            <input class="function" type="button" value="AC" onclick="clikFunctions()">
            <input class="number" type="button" value="0" onclick="clickNumbers()">
            <input class="number" type="button" value="." >
            <input class="equal" type="button" value="=" onclick="clickOperators()">
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
